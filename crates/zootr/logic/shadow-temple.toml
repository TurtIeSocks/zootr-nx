# Shadow Temple. Rules from Ship's routes for the original game, on the
# playtest list (Ship-first rules, 2026-11-24).
#
# Only adult Link is inside, so child-only tools are left out. The route in
# order: the Lens for the invisible path, the Hover Boots to the Beamos
# junction, explosives for the guillotine corridor to the huge pit, the
# Lens again for the pit's door ledges, a Hookshot (or the Longshot) over
# the floor spikes to the wind tunnel, then the boat.

# Room 3, Map Room: the Lens for the whispering walls, then a ReDead and
# the Keese in the side room.
[[check]]
hash = 13528903653876646082
name = "Shadow Temple Map Chest"
needs = "lens and (melee or hammer or dins-fire) and (melee or hammer or explosives or hookshot or bow)"

# Room 4, Dead Hand Room: the Lens down the whispering walls, and Dead
# Hand falls only to a sword.
[[check]]
hash = 14535080241831873137
name = "Shadow Temple Hover Boots Chest"
needs = "lens and adult-sword"

# Room 6, Spinning Blade Room: the Hover Boots reach the Beamos junction
