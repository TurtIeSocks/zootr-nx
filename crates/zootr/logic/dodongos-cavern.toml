# Dodongo's Cavern. Rules from Ship's routes for the original game, on the
# playtest list (Ship-first rules, 2026-11-24).
#
# The door's boulder wall wants a blast, the hammer or the Goron's Bracelet,
# so every check starts there. The stairs room opens once the lobby switch
# is pressed (an adult steps on it; a child gets there through the Dodongo
# room with a flame), and the stairs themselves take an explosive, the
# Bracelet or Din's Fire. The bomb room above is reached without bombs: the
# Hover Boots or Longshot jump the gap, or the Bow or Slingshot hit the eye
# switches through the slingshot rooms.

