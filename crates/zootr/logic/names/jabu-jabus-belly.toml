# Jabu Jabus Belly. OoTR's name wherever the remake keeps the spot: the
# remake keeps the original's rooms, so pots, chests and Gold Skulltulas
# match by room, rule and vanilla item, and the remake guides for the
# Skulltulas. Pots go by room, numbered west to east.
#
# Every name carries its map floor after "Jabu", as the dungeon
# map shows it with Link beside the check (sweeps of 2026-11-25). Checks
# in one room at one height share the floor read for them. Every floor
# is one the game's map lists for the check's room; where a warp landed
# in the next room, the room's own floor stands.

