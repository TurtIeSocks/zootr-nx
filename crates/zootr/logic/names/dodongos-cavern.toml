# Dodongos Cavern. OoTR's name wherever the remake keeps the spot: chests
# matched by room, rule and vanilla item, rooms by their landmarks (the
# blade traps, the one and two eye switches, the last block), and the
# remake guides for the Gold Skulltulas. Pots go by room, numbered west
# to east.
#
# Every name carries its map floor after "Dodongos Cavern", as the dungeon
# map shows it with Link beside the check (sweeps of 2026-11-25). Checks
