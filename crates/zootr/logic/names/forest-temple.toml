# Forest Temple. OoTR's name wherever the remake keeps the spot: matched
# by each check's room, its rule and the item the vanilla game puts there.
# Pots go by room in OoTR's room words, numbered west to east. The lobby's
# pots split left and right as OoTR's do, facing north from the entrance.
#
# Every name carries its map floor after "Forest Temple", as the dungeon
# map shows it with Link beside the check (sweeps of 2026-11-25). Checks
# in one room at one height share the floor read for them. Every floor
# is one the game's map lists for the check's room; where a warp landed
# in the next room, the room's own floor stands.

