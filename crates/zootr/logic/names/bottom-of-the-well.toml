# Bottom of the Well. OoTR's name wherever the remake keeps the spot:
# chests matched by where they sit in the main hall (front and back,
# left and right as Link enters from the south), their rule and vanilla
# item, and the remake guides for the Gold Skulltulas. The remake's hall
# differs from the original's in places, so several matches are marked.
# Pots and grass go by room, numbered west to east.
#
# Every name carries its map floor after "Bottom of the Well", as the dungeon
# map shows it with Link beside the check (sweeps of 2026-11-25). Checks
# in one room at one height share the floor read for them. Every floor
# is one the game's map lists for the check's room; where a warp landed
# in the next room, the room's own floor stands.

