# Kokiri Forest. OoTR's name wherever the remake keeps the spot: matched
# by position against the remake's houses, doors, soil and streams, the
# rule comments and the remake guides for the Gold Skulltulas. The bridge
# to Hyrule Field is in the west, the Lost Woods in the north, the Deku
# Tree in the east, Link's house in the southwest.
#
# The child and adult maps each hold their own copy of many pots, rocks,
# grass and hearts, as separate checks. Where both ages have one at the
# same spot, the name says which, as OoTR's Market Guard House Child Pot
# does, and the two share a number. Numbers count west to east within one
# spot.
#
# The map takes in the bridge out to Hyrule Field, which OoTR counts as
# Lost Woods. The scrub and the ledge chest there are placed in the Lost
# Woods map as well, as separate checks named with LW.

