# Market and the Temple of Time

# The Door of Time, then the Master Sword. Closed, it opens only once the
# quest is past the moat scene: the flow the song runs checks it.
[[exit]]
from = "market-child"
to = "market-adult"
added = true
needs = "setting:door-of-time=open or (event:moat-scene and item:ocarina-of-time and song-of-time)"

[[exit]]
from = "market-adult"
to = "market-child"
added = true
needs = "always"

# The rainbow bridge, by the Rainbow Bridge setting. Vanilla arms it with
# Zelda's Light Arrows scene, so it needs what the Light Arrows check does.
# Six Medallions needs all six. Open stands from the start.
[[exit]]
from = "market-adult"
to = "ganons-castle"
needs = "setting:rainbow-bridge=open or (setting:rainbow-bridge=six-medallions and item:forest-medallion and item:fire-medallion and item:water-medallion and item:shadow-medallion and item:spirit-medallion and item:light-medallion) or (setting:rainbow-bridge=vanilla and beat:bongo-bongo and beat:twinrova)"

