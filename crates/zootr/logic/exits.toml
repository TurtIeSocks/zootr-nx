# What an exit between two maps needs. The game's exits are area sensors
# that need nothing, so each rule here is an NPC, a door or a hazard on the
# way, written from the original game and on the playtest list.
#
# A rule covers the exit in every era it exists in. An exit the game's data
# doesn't have, like a boss door, says `added = true`.

# Kokiri Forest

[[exit]]
from = "kokiri-forest-child"
to = "hyrule-field-child"
needs = "setting:open-forest or beat:gohma"

[[exit]]
from = "kokiri-forest-child"
to = "deku-tree"
needs = "setting:open-forest or (kokiri-sword and deku-shield)"

# The tree is dead by then, and debris blocks its mouth unless the setting
# clears it.
[[exit]]
from = "kokiri-forest-adult"
to = "deku-tree"
needs = "setting:adult-deku-tree"

