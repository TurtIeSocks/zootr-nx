# Boss doors. Boss keys are `always`, like small keys. Each rule is the
# stricter of Ship's route through the dungeon and the maintainer's notes
# on the remake (docs/research/ship-boss-logic.md): Dodongo wants bombs,
# not bombchus, Barinade the slingshot, Phantom Ganon the Song of Time and
# Morpha Zelda's Lullaby. Bongo Bongo needs no longshot once keys are
# `always`. Zelda's Lullaby brings the ocarina with it.
#
# Each door's tools carry their era, so a dungeon open to the other era
# asks that era for them. Only Gohma's has a way for both: adult Link sends
# the nuts back off the Hylian Shield and shoots the eye with the Bow.

[[exit]]
from = "deku-tree"
to = "gohma-room"
added = true
needs = "((deku-shield and slingshot) or (hylian-shield and bow)) and (sticks or fire) and melee"

# The bomb room's eye targets: the slingshot as a child, the bow as an
# adult, or for an adult the Hover Boots or Longshot past them.
[[exit]]
from = "dodongos-cavern"
to = "king-dodongo-room"
added = true
needs = "bombs and melee and (slingshot or bow or hover-boots or longshot)"

[[exit]]
from = "jabu-jabu"
to = "barinade-room"
added = true
needs = "boomerang and slingshot and melee"

[[exit]]
from = "forest-temple"
to = "phantom-ganon-room"
added = true
needs = "bow and hookshot and goron-bracelet and song-of-time and adult-sword"

[[exit]]
from = "fire-temple"
to = "volvagia-room"
added = true
needs = "hammer and goron-tunic and goron-bracelet and explosives"

[[exit]]
from = "water-temple"
to = "morpha-room"
added = true
needs = "longshot and iron-boots and zora-tunic and zeldas-lullaby and (bow or fire) and (adult-sword or hammer)"

[[exit]]
from = "shadow-temple"
to = "bongo-bongo-room"
added = true
needs = "lens and hover-boots and bow and explosives and zeldas-lullaby and hookshot and goron-bracelet and adult-sword"

[[exit]]
from = "spirit-temple"
to = "twinrova-room"
added = true
needs = "silver-gauntlets and mirror-shield and hookshot and explosives and lens and bow and zeldas-lullaby and item:requiem-of-spirit and (adult-sword or hammer)"

# The climb to Ganondorf, past the six trials' barrier. With Ganon's
# Trials on Done the barrier is down. On All Six, coarsely, the room asks
# for every trial's tools at once, with the Light Arrows for each barrier
# in the climb:
# - Forest: the Hover Boots, or the Song of Time block and Hookshot, and
#   magic, the Bow and Din's Fire or Fire Arrows
# - Water: blue fire for the red ice and the hammer for the rusted switch
# - Shadow: the Golden Gauntlets, Bow, Lens of Truth and Hover Boots
# - Spirit: the Hookshot, the Mirror Shield for the sun switches and
#   Bombchus
# - Fire: the Golden Gauntlets and Longshot
# - Light: the Golden Gauntlets and Hookshot, and the castle's one small
#   key, which the boss key door's need deals with keys as copies
[[exit]]
from = "inside-ganons-castle"
to = "ganondorf-room"
added = true
needs = "(setting:ganons-trials=done or ((hover-boots or (song-of-time and hookshot)) and magic and bow and (item:dins-fire or item:fire-arrows) and blue-fire and hammer and gold-gauntlets and bow and lens and hover-boots and hookshot and mirror-shield and bombchus and longshot)) and magic and bow and item:light-arrows and master-sword"

# Maps the game swaps for their `_Alternative` copy once a sage is done,
# for good. The game's own gate is a flag logic can't read, so each
# alternative has its rule here, and one without fails the build.

# Kakariko burns once the Forest, Fire and Water sages are done.
[[alternative]]
place = "kakariko-village-adult"
needs = "beat:phantom-ganon and beat:volvagia and beat:morpha"

# Zora's Domain thaws once the Water sage is done.
[[alternative]]
place = "zora-domain-adult"
needs = "beat:morpha"

# Inside each dungeon. A door's rule above holds at the door. Once doors
# shuffle, a door adds what the dungeon behind it needs inside, which that
# dungeon's own door had covered. A dungeon whose rules were written for one
# era names that era until its other era is audited.

# Both eras audited, adult since the Adult Deku Tree setting.
[[inside]]
place = "deku-tree"
needs = "always"

# Both eras walk in from the trail.
[[inside]]
place = "dodongos-cavern"
needs = "always"

# Only a child walks in, and its tentacles take the Boomerang.
[[inside]]
place = "jabu-jabu"
needs = "child"

[[inside]]
place = "forest-temple"
needs = "adult"

# The heat: the crater's tunic.
[[inside]]
place = "fire-temple"
needs = "goron-tunic"

# Flooded: the lake bottom's boots and tunic.
[[inside]]
place = "water-temple"
needs = "iron-boots and zora-tunic"

[[inside]]
place = "shadow-temple"
needs = "adult"

# Its rules name each era's side.
[[inside]]
place = "spirit-temple"
needs = "always"

# Both eras audited: the crawl holes name child.
[[inside]]
place = "bottom-of-the-well"
needs = "always"

[[inside]]
place = "ice-cavern"
needs = "adult"

[[inside]]
place = "gerudo-training-ground"
needs = "adult"

[[inside]]
place = "inside-ganons-castle"
needs = "adult"
