# What an exit between two maps needs. The game's exits are area sensors
# that need nothing, so each rule here is an NPC, a door or a hazard on the
# way, written from the original game and on the playtest list.
#
# A rule covers the exit in every era it exists in. An exit the game's data
# doesn't have, like a boss door, says `added = true`.

# Kokiri Forest

[[exit]]
from = "kokiri-forest-child"
to = "hyrule-field-child"
needs = "setting:open-forest or beat:gohma"

[[exit]]
from = "kokiri-forest-child"
to = "deku-tree"
needs = "setting:open-forest or (kokiri-sword and deku-shield)"

# The tree is dead by then.
[[exit]]
from = "kokiri-forest-adult"
to = "deku-tree"
needs = "child"

# Lost Woods

[[exit]]
from = "lost-woods-child"
to = "goron-city-child"
needs = "explosives or hammer"

[[exit]]
from = "lost-woods-adult"
to = "goron-city-adult"
needs = "explosives or hammer"

[[exit]]
from = "goron-city-child"
to = "lost-woods-child"
needs = "explosives or hammer"

[[exit]]
from = "goron-city-adult"
to = "lost-woods-adult"
needs = "explosives or hammer"

[[exit]]
from = "lost-woods-child"
to = "zora-river-child"
needs = "silver-scale"

[[exit]]
from = "lost-woods-adult"
to = "zora-river-adult"
needs = "silver-scale"

[[exit]]
from = "zora-river-child"
to = "lost-woods-child"
needs = "silver-scale"

[[exit]]
from = "zora-river-adult"
to = "lost-woods-adult"
needs = "silver-scale"

[[exit]]
from = "sacred-forest-meadow-child"
to = "forest-temple"
needs = "hookshot"

[[exit]]
from = "sacred-forest-meadow-adult"
to = "forest-temple"
needs = "hookshot"

# Market and the Temple of Time

# The Door of Time, then the Master Sword.
[[exit]]
from = "market-child"
to = "market-adult"
added = true
needs = "setting:open-door-of-time or (beat:gohma and beat:king-dodongo and beat:barinade and item:ocarina-of-time and song-of-time)"

[[exit]]
from = "market-adult"
to = "market-child"
added = true
needs = "always"

[[exit]]
from = "market-adult"
to = "ganons-castle"
needs = "setting:rainbow-bridge or (item:forest-medallion and item:fire-medallion and item:water-medallion and item:shadow-medallion and item:spirit-medallion and item:light-medallion and beat:bongo-bongo and beat:twinrova)"

# Kakariko and the graveyard

[[exit]]
from = "kakariko-village-child"
to = "death-mountain-trail-child"
needs = "setting:kakariko-gate or item:zeldas-letter"

# The windmill drains the well, and only child Link fits inside.
[[exit]]
from = "kakariko-village-child"
to = "bottom-of-the-well"
needs = "song-of-storms"

[[exit]]
from = "kakariko-village-adult"
to = "bottom-of-the-well"
needs = "child"

[[exit]]
from = "kakariko-village-adult-alternative"
to = "bottom-of-the-well"
needs = "child"

# The door is up by the Nocturne pad, behind torches.
[[exit]]
from = "graveyard-child"
to = "shadow-temple"
needs = "adult"

[[exit]]
from = "graveyard-adult"
to = "shadow-temple"
needs = "fire and ocarina and item:nocturne-of-shadow"

