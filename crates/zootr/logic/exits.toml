from = "lost-woods-child"
to = "goron-city-child"
needs = "explosives or hammer"

[[exit]]
from = "lost-woods-adult"
to = "goron-city-adult"
needs = "explosives or hammer"

[[exit]]
from = "goron-city-child"
to = "lost-woods-child"
needs = "explosives or hammer"

[[exit]]
from = "goron-city-adult"
to = "lost-woods-adult"
needs = "explosives or hammer"

[[exit]]
from = "lost-woods-child"
to = "zora-river-child"
needs = "silver-scale"

[[exit]]
from = "lost-woods-adult"
to = "zora-river-adult"
needs = "silver-scale"

[[exit]]
from = "zora-river-child"
to = "lost-woods-child"
needs = "silver-scale"

[[exit]]
from = "zora-river-adult"
to = "lost-woods-adult"
needs = "silver-scale"

[[exit]]
