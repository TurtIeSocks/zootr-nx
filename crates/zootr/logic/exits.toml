# Boss doors. Boss keys are `always`, like small keys. Each rule is the
# stricter of Ship's route through the dungeon and the maintainer's notes
# on the remake (docs/research/ship-boss-logic.md): Dodongo wants bombs,
# not bombchus, Barinade the slingshot, Phantom Ganon the Song of Time and
# Morpha Zelda's Lullaby. Bongo Bongo needs no longshot once keys are
# `always`. Zelda's Lullaby brings the ocarina with it.

[[exit]]
from = "deku-tree"
to = "gohma-room"
added = true
needs = "deku-shield and slingshot and (sticks or fire) and melee"

# The bomb room's eye targets: the slingshot as a child, the bow as an
# adult, or for an adult the Hover Boots or Longshot past them.
[[exit]]
from = "dodongos-cavern"
to = "king-dodongo-room"
added = true
needs = "bombs and melee and (slingshot or bow or hover-boots or longshot)"

[[exit]]
from = "jabu-jabu"
to = "barinade-room"
added = true
needs = "boomerang and slingshot and melee"

[[exit]]
from = "forest-temple"
to = "phantom-ganon-room"
added = true
needs = "bow and hookshot and goron-bracelet and song-of-time"

[[exit]]
from = "fire-temple"
to = "volvagia-room"
added = true
needs = "hammer and goron-tunic and goron-bracelet and explosives"

[[exit]]
from = "water-temple"
to = "morpha-room"
added = true
needs = "longshot and iron-boots and zora-tunic and zeldas-lullaby and (bow or fire)"

[[exit]]
from = "shadow-temple"
to = "bongo-bongo-room"
added = true
needs = "lens and hover-boots and bow and explosives and zeldas-lullaby and hookshot and goron-bracelet"

[[exit]]
from = "spirit-temple"
to = "twinrova-room"
added = true
needs = "silver-gauntlets and mirror-shield and hookshot and explosives and lens and bow and zeldas-lullaby and item:requiem-of-spirit"

[[exit]]
from = "inside-ganons-castle"
to = "ganondorf-room"
added = true
needs = "setting:trials-done and magic and bow and item:light-arrows"

# Maps the game swaps for their `_Alternative` copy once a sage is done,
# for good. The game's own gate is a flag logic can't read, so each
# alternative has its rule here, and one without fails the build.

# Kakariko burns once the Forest, Fire and Water sages are done.
[[alternative]]
place = "kakariko-village-adult"
needs = "beat:phantom-ganon and beat:volvagia and beat:morpha"

# Zora's Domain thaws once the Water sage is done.
[[alternative]]
place = "zora-domain-adult"
needs = "beat:morpha"
