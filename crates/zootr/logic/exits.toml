# What an exit between two maps needs. The game's exits are area sensors
# that need nothing, so each rule here is an NPC, a door or a hazard on the
# way, written from the original game and on the playtest list.
#
# A rule covers the exit in every era it exists in. An exit the game's data
# doesn't have, like a boss door, says `added = true`.

# Kokiri Forest

[[exit]]
from = "KokiriForest_Child"
to = "HyruleField_Child"
needs = "setting:open-forest or Beat_Gohma"

[[exit]]
from = "KokiriForest_Child"
to = "InsideTheDekuTree"
needs = "setting:open-forest or (kokiri-sword and deku-shield)"

# The tree is dead by then.
[[exit]]
from = "KokiriForest_Adult"
to = "InsideTheDekuTree"
needs = "child"

# Lost Woods

[[exit]]
from = "LostWood_Child"
to = "GoronCity_Child"
needs = "explosives or hammer"

[[exit]]
from = "LostWood_Adult"
to = "GoronCity_Adult"
needs = "explosives or hammer"

[[exit]]
from = "GoronCity_Child"
to = "LostWood_Child"
needs = "explosives or hammer"

[[exit]]
from = "GoronCity_Adult"
to = "LostWood_Adult"
needs = "explosives or hammer"

[[exit]]
from = "LostWood_Child"
to = "ZoraRiver_Child"
needs = "silver-scale"

[[exit]]
from = "LostWood_Adult"
to = "ZoraRiver_Adult"
needs = "silver-scale"

[[exit]]
from = "ZoraRiver_Child"
to = "LostWood_Child"
needs = "silver-scale"

[[exit]]
from = "ZoraRiver_Adult"
to = "LostWood_Adult"
needs = "silver-scale"

[[exit]]
from = "SacredForestMeadow_Child"
to = "ForestTemple"
needs = "hookshot"

[[exit]]
from = "SacredForestMeadow_Adult"
to = "ForestTemple"
needs = "hookshot"

# Market and the Temple of Time

# The Door of Time, then the Master Sword.
[[exit]]
from = "Market_Child"
to = "Market_Adult"
added = true
needs = "setting:open-door-of-time or (Beat_Gohma and Beat_KingDodongo and Beat_Barinade and Item_Ocarina_Time and song-of-time)"

[[exit]]
from = "Market_Adult"
to = "Market_Child"
added = true
needs = "always"

[[exit]]
from = "Market_Adult"
to = "GanonCastle"
needs = "setting:rainbow-bridge or (Item_Medal_Forest and Item_Medal_Fire and Item_Medal_Water and Item_Medal_Shadow and Item_Medal_Spirit and Item_Medal_Light and Beat_BongoBongo and Beat_Twinrova)"

# Kakariko and the graveyard

[[exit]]
from = "KakarikoVillage_Child"
to = "DeathMountainTrail_Child"
needs = "setting:kakariko-gate or Item_ZeldaLetter"

# The windmill drains the well, and only child Link fits inside.
[[exit]]
from = "KakarikoVillage_Child"
to = "BottomOfTheWell"
needs = "song-of-storms"

[[exit]]
from = "KakarikoVillage_Adult"
to = "BottomOfTheWell"
needs = "child"

[[exit]]
from = "KakarikoVillage_Adult_Alternative"
to = "BottomOfTheWell"
needs = "child"

# The door is up by the Nocturne pad, behind torches.
[[exit]]
from = "Graveyard_Child"
to = "ShadowTemple"
needs = "adult"

[[exit]]
from = "Graveyard_Adult"
to = "ShadowTemple"
needs = "fire and ocarina and Item_Melody_ShadowNocturne"

