# Jabu-Jabu's Belly. Rules from Ship's routes for the original game, on the
# playtest list (Ship-first rules, 2026-11-24).
#
# Only a child walks in. The corridor's switch past the first door is hit
# from afar, so every check wants a projectile first: an explosive, an arrow,
# a hookshot, a seed or the Boomerang. The tentacles in the forked corridor
# fall to the Boomerang alone.

