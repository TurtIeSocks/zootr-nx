    { hash = 10743352138513225188, keys = 7 },
    { hash = 1941083939696166170, keys = 9 },
    { hash = 4320448574091221496, keys = 3 },
    { hash = 9911316961118170383, keys = 3 },
]

# Five locks, five keys, a chain from the entrance. Rooms 0 to 7, 26 and
# 30 (the entrance, the whispering walls, the Beamos junction and its
# side rooms) lie before any lock, so they take the default 0. The key in
# room 6's chest needs no lock, so Link starts the chain with one key.
#   Lock 1, east wall of the Beamos junction (room 5) at 96,86,1.4: leads
#     to the guillotine corridor (room 8), then the huge pit (room 9) and
#     everything off it: rooms 10 and 31 (the invisible blades, whose door
#     has no lock here) and room 11 (falling spikes, a key chest).
#     Ship's first locked exit. 1 key.
#   Lock 2, south of the floor spikes room (room 12) at 56.9,52.5,45.5:
#     leads from the pit (room 9) to room 12 and the skull pot room (13,
#     the key lying in the open). Ship's floor spikes south door. Link
#     could also have opened lock 1, so 2 keys.
#   Lock 3, north end of room 12 at 56.9,56,26.5: leads to the wind room
#     (14), the hint alcove (15) and the Gibdo room (16, a key chest).
#     Ship's door onto the wind tunnel. 3 keys.
#   Lock 4, north of the Gibdo room at 109.7,52,-27.1: leads to the boat
#     room (17) and the boat (29), then the maze (18, 20, 21, the last key
#     chest) and the chasm and boss door rooms (22 to 24). Ship's door to
#     the dock. 4 keys.
#   Lock 5, north of the maze hub (room 18) at -181.8,41.3,-61.8: leads to
#     the spiked walls room (19, the Boss Key and a magic jar). Ship has no
#     lock here: its fifth lock is the door before the boss door (room 22
#     here), which has no chain in the remake, so rooms 22 to 24 count 4.
#     Link could have opened locks 1 to 4 first, so 5 keys.
# Every key chest can be taken in turn: room 6 (0), room 11 (1), room 13
# (2), room 16 (3), room 21 (4), five keys in all.
[[dungeon]]
name = "shadow-temple"
keys = 0
rooms = [
    { room = 8, keys = 1 },
    { room = 9, keys = 1 },
    { room = 10, keys = 1 },
    { room = 11, keys = 1 },
    { room = 31, keys = 1 },
    { room = 12, keys = 2 },
    { room = 13, keys = 2 },
    { room = 14, keys = 3 },
    { room = 15, keys = 3 },
    { room = 16, keys = 3 },
    { room = 17, keys = 4 },
    { room = 18, keys = 4 },
    { room = 20, keys = 4 },
    { room = 21, keys = 4 },
    { room = 22, keys = 4 },
    { room = 23, keys = 4 },
    { room = 24, keys = 4 },
    { room = 29, keys = 4 },
    { room = 19, keys = 5 },
]

# Five locks, five keys, one map both ages share. Keys are shared too, so
# a key spent on one side can leave the other short.
#   A (-33.6, 106.0, -55.3): the child side's first lock, room 5 to the
#     foot of the climb, which we count as room 6. Ship's child boxes to
#     sun-on-floor exit.
#   B (33.6, 104.8, -39.5): the adult side's first lock, room 13 to room
#     17, then the mirror room (18). Ship's adult hub to 1F mirror exit.
#   C (-55.8, 132.1, 8.4): room 10 (sun block hall) to room 11 (right Iron
#     Knuckle), then the right hand (12). Ship's skulltula stairs to child
#     throne exit, 3 keys either way.
#   E (18.0, 129.1, -39.4): the statue hall (7) to room 20, then 21 to 26
#     (armos, red rupees, left Iron Knuckle, left hand, key alcove). Ship's
#     statue room adult to pot stairs exit, 4 keys.
#   F (29.3, 130.0, -17.5): room 21 to the moving wall room (27), then 28
#     to 31 (boss key, mirrors, topmost chest). Ship's beamos pits to big
#     wall exit, 5 keys.
# All five match Ship's locked exits. The boss door (room 7 to 32) takes
# the boss key, so it is left out. Rooms 32 and 33 follow Ship's way to
# the boss door, which needs the 4F mirrors behind F.
#
# Ship counts the shared rooms by age: the child only reaches a shared
# check for certain with all 5 keys (the adult may have spent 4 on B, C,
# E and F), the adult with 3 (the child can only have spent A and C). A
# check either age can make needs only 1 or 2, and one room can hold both
# kinds, so one count per room cannot say it. Each room here takes its
# adult-only check's 3 if it has one (statue hall 7: the hand key chest
# and the west ledge skulltula; mirror room 18; alcove 19), else 2 where
# every check takes either age (rooms 6, 8, 9, 10: Ship asks 1 key with
# explosives, 2 without). The child-only 5 never binds a check in our
# file. The right hand (12) takes Ship's 5, which it asks unless Link
# holds the Longshot: one count can't follow that, and no key lies there.
#
# Check, from 0 keys: the child torch key (room 4) and the boulder room
# key (room 16) sit behind no lock, 2 keys. The sun block ledge key (room
# 9, 2) makes 3, the statue hand key (room 7, 3) makes 4, the key alcove
# (room 26, 4) makes 5. All five are taken.
[[dungeon]]
name = "spirit-temple"
keys = 0
rooms = [
    { room = 6, keys = 2 },
    { room = 7, keys = 3 },
    { room = 8, keys = 2 },
    { room = 9, keys = 2 },
    { room = 10, keys = 2 },
    { room = 11, keys = 3 },
    { room = 12, keys = 5 },
    { room = 17, keys = 1 },
    { room = 18, keys = 3 },
    { room = 19, keys = 3 },
    { room = 20, keys = 4 },
    { room = 21, keys = 4 },
    { room = 22, keys = 4 },
    { room = 23, keys = 4 },
    { room = 24, keys = 4 },
    { room = 25, keys = 4 },
    { room = 26, keys = 4 },
    { room = 27, keys = 5 },
    { room = 28, keys = 5 },
    { room = 29, keys = 5 },
    { room = 30, keys = 5 },
    { room = 31, keys = 5 },
    { room = 32, keys = 5 },
    { room = 33, keys = 5 },
]

# Five locks, in one line, so each needs 1 plus the locks before it.
# Lock A, at (0, 103, 44.5), is at the entrance: it shuts the first room
# (0, with a key chest) off from the Skulltula hall (1) and so from the
# rest. Ship's temple has no lock there, so every other count here is one
# above Ship's. Lock B, at (-26, 103.5, 0), is Ship's lobby lock: lobby
# (2) to the west hall (5), then the block rooms (6 to 8) and the bubble
# lamp room (9) at their top; it needs 2. Lock C, at (-56.5, 124.5,
# -11.4), is Ship's lock at the top of the block rooms: room 9 to the
# twisted corridor (10), the Wallmaster hall (11) and the red Poe room
# (16), which holds a key chest, then the bow room (17); it needs 3. Ship's
# next two locks (into the red Poe room, and out of the blue Poe room)
# are not in ours. Instead lock D, at (14.5, 114.5, -59.5), sits between
# the bow room (17) and the blue Poe room (18), which leads on to the
# corridors (19, 20); it needs 4. Lock E, at (56.5, 124.5, -11.5), is
# Ship's last lock: room 20 to the twist switch room (23); it needs 5.
# Other ways round: the Floormaster room (22) is off the courtyard's upper
# floor, reached by hover boots from the block rooms (past lock B) or
# from the boss key ledge (past lock C), so it takes 2. The courtyards
# (12, 14, 15) and the rooms off them need only lock A. The rotating
# floor room (27) opens once the three Poes fall, and the blue Poe is
# behind lock D, so it takes 4. Check: the first room's chest needs 0,
# the Stalfos room's and the well's need 1 (3 keys), the Floormaster
# room's needs 2 (4 keys), the red Poe room's needs 3: all five taken.
[[dungeon]]
name = "forest-temple"
keys = 1
rooms = [
