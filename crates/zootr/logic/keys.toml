# Seven locks, in one line apart from the loop door. Lock 1, at (10.5,
# 105, 0): foyer (0) to the lava room (1) and its bombable cell (22), and
# the Like Like room (19) off it. Ship needs 2 keys here, 1 for a spare it
# may spend on the loop door, but ours is shut off by Hammer pillars and
# the Hammer lies past lock 5, so only 1 is needed (the near boss chest,
# in room 2, is the one free key). Lock 2, at (68.3, 105, 0), is Ship's
# lava geyser lock: lava room to the geyser corridor (21), 2 keys. Lock 3,
# at (111.8, 107.6, 0), is the corridor's far end, Ship's lock into the
# shortcut: up to the shortcut room (4) and on to the boulder maze (5),
# the eye switch passage (6), the ledges (7, 8) and the upper hall (16),
# 3 keys. Lock 4, at (41.7, 147, -8.6), is the maze's north door into the
# eye switch passage (6). Ship has two locks between maze and fire wall
# chase; ours has this one plus a free south door and the eye switch, so
# Link may spend a key here but need not: rooms 6 and 16 stay at 3, and
# lock 4 counts as a spare in the counts after it. Lock 5, at (5.2,
# 150.6, 0.1), is Ship's last-but-one lock: the upper hall (16) to the fire
# wall maze (10), 1 plus locks 1 to 4 is 5. Past it lie the maze, the
# Flare Dancer room (24) and the Hammer's rooms (9, 12, 13, 14, 25, 27).
# Lock 6, at (-44.5, 147, 8.7), shuts the Song of Time cage (11) from the
# maze, but the cage's south door is free, matching Ship's upper way in,
