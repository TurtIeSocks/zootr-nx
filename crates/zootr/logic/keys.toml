    { room = 5, keys = 2 },
    { room = 6, keys = 2 },
    { room = 7, keys = 2 },
    { room = 8, keys = 2 },
    { room = 9, keys = 2 },
    { room = 10, keys = 3 },
    { room = 11, keys = 3 },
    { room = 16, keys = 3 },
    { room = 17, keys = 3 },
    { room = 18, keys = 4 },
    { room = 19, keys = 4 },
    { room = 20, keys = 4 },
    { room = 21, keys = 2 },
    { room = 22, keys = 2 },
    { room = 23, keys = 5 },
    { room = 27, keys = 4 },
]
