# How many of its dungeon's small keys a check needs, by the room its
# placement names (`DefaultDungeonRoomIndex`), with keys dealt as copies.
#
# Each count is the worst order Link could spend keys in: a lock needs 1
# plus every other lock he can open without passing it, since he may have
# spent keys there first. A room needs the smallest count over the ways
# in, taking the largest lock along each way. `keys` is every room the
# dungeon doesn't list.
#
# A dungeon left out asks for all its keys at every check (EIE row 2).

# Two locks, both off the hall (room 1), each into one of the two inner
# rooms of the hall's central block: room 5 west, room 4 east, a Gold
# Skulltula in each. Either may take the first key. Ship's well has a
# third lock, ours doesn't.
[[dungeon]]
name = "bottom-of-the-well"
keys = 0
rooms = [
    { room = 4, keys = 2 },
    { room = 5, keys = 2 },
]

# One lock, in the Light Trial, between the Lens of Truth chest's room
# (13) and the silver rupee room (14), which leads on to room 15. Rooms
# 12 and 13 open off the hub (room 1). Ship's Light Trial has a second
# lock before the Triforce room, ours doesn't.
[[dungeon]]
name = "inside-ganon-castle"
keys = 0
rooms = [
    { room = 14, keys = 1 },
    { room = 15, keys = 1 },
]

# Four locks and four keys (the original game had six keys for five).
# A: the central pillar's west door, low water, into the pillar (rooms 1
# and 2). B: the hall's west wall at mid water, into the jet room (10).
# C: the hall's west wall at high water, to the waterfall, Dark Link and
# the Longshot (rooms 5, 6, 22, 7, 21). D: the hall's north wall, low,
# the half-flooded passage on to the boulders and the Boss Key (24, 15).
# Keys 1 to 3 (rooms 4, 8, 18) lie behind no lock. Key 4 (room 20) and
# lock D both need the Longshot, found past C, so before it Link can
# open only A, B and C, with three keys. A Longshot found outside the
# temple lets him open D first: then C needs key 4, which also needs
# the Bow. The remake's walkthrough opens A, B, C, then D.
[[dungeon]]
name = "water-temple"
keys = 0
rooms = [
    { room = 1, keys = 3 },
    { room = 2, keys = 3 },
    { room = 5, keys = 3 },
    { room = 6, keys = 3 },
    { room = 7, keys = 3 },
    { room = 10, keys = 3 },
    { room = 21, keys = 3 },
    { room = 22, keys = 3 },
    { room = 15, keys = 4 },
    { room = 24, keys = 4 },
]

# Nine locks, all inside the central maze (room 8), met one after another
# on its single path, so each maze chest counts the locks before it, as in
# Ship's route: the first path chest 4, the second 6, the third 7, the
# Ice Arrows chest 9. The two key chests high above the maze are the
# hidden ceiling chest (3) and the one by the scarecrow (0), and which is
# which is a guess, so both count 3. The maze's right side counts 0: its
# rule takes the lava room's way with the Song of Time, the vanilla way
# to the ninth key. The other six key chests (rooms 1, 4, 5, 7, 9, 10)
# lie behind no lock.
[[dungeon]]
name = "gerudo-training-ground"
keys = 0
checks = [
