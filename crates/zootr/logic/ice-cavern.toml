# Ice Cavern. Rules from Ship's routes for the original game, on the
# playtest list (Ship-first rules, 2026-11-24).
#
# Only an adult walks in. Past the Freezards, the Spinning Blade Room hub
# opens the rest: blue fire melts the red ice to the Compass Room and the
# Block Puzzle, and the stalagmites there are cleared by a blade, the
# hammer or an explosive.

# Room 3, Spinning Blade Room: the Skulltula is reached once the Freezards in the corridor are dead.
[[check]]
hash = 7165255787572043804
name = "Spinning Blade Room Gold Skulltula"
needs = "(adult-sword or hammer or explosives or hookshot or fire)"
setting = "gold-skulltulas"

# Room 5, Map Room: red ice around the chest, melted by the room's own blue fire (playtest), past the Freezards and the silver rupees that need the stalagmites cleared.
[[check]]
