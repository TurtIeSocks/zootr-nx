# Zelda and Impa ride out over the drawbridge once the quest has counted
# the three stones, then Zelda's gift and song wait in the moat. Open or
# Closed, this is the only way to them, and the Closed door opens only
# after it.
[[source]]
name = "Moat scene"
place = "hyrule-field-child"
era = "child"
item = "event:moat-scene"
needs = "(setting:met-zelda or event:met-zelda) and beat:gohma and beat:king-dodongo and beat:barinade"

