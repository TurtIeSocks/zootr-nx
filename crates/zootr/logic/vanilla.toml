# Where Link gets each item that isn't shuffled yet, so logic knows. An
# entry goes the day its source joins the pool. Rules follow the original
# game and are on the playtest list.

# Boss defeats. The world reads the quest steps a boss sets, never the
# reward Link holds, so gates name these. They're never shuffled.

