# The Spirit Temple is one map both ages share, so its obstacles
# together ask for child-only crawl holes and the adult-only Hammer at
# once, which no one Link meets. Each check says which side it's on
# instead, matched to the original game's check by what stands around
# it, with Ship's rule for that check. Keys are `always`, so the key
# counts drop out. Rules on the playtest list.

# The child side's bridge room, past the crawl holes: a hit switch drops
# the bridge to the chest.
[[check]]
hash = 5309180490719879013
name = "Deku Shield"
needs = "slingshot or boomerang"

# Atop the child side's climb. Child Link shoots the switch himself, or
# adult Link comes round from the central chamber.
[[check]]
hash = 1501288453962537671
name = "Upper Five Bombchus"
needs = "slingshot or boomerang or (silver-gauntlets and (bow or hookshot))"

# The adult side's first mirror room, past the silver block: turning the
