# Bottom of the Well. Rules from Ship's routes for the original game, on the
# playtest list (Ship-first rules, 2026-11-24).
#
# Only a child fits the crawl hole, and the Big Skulltula in the corridor
# behind it has to be killed or slipped past, which takes a blade, a stick,
# bombs, Din's Fire, the Slingshot or the Boomerang. The new rules below
# start with that. The two entries from the first playtest follow, as they
# were written.

# Room 1's lower level stays underwater until Zelda's Lullaby is played at
# the Triforce point in it, which sets its water-stopped flag and drains
# it. Link reaches it through a crawl hole, so only as a child.
