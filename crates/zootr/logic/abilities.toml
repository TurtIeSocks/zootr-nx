# Ability words, shared by the rule files and the obstacle tool table.
# Each one is a rule over item actors, `child` or `adult`, `setting:<id>`,
# `flag:<name>`, `always` and other abilities.
#
# Era limits follow the original game until a playtest says otherwise.

explosives = "bombs or bombchus"
bombs = "item:bomb-bag"
bombchus = "(item:bombchus-small or item:bombchus-medium or item:bombchus-large) and (bombs or setting:free-bombchus)"

hammer = "adult and item:megaton-hammer"
goron-bracelet = "item:goron-bracelet"
silver-gauntlets = "adult and item:silver-gauntlets"
gold-gauntlets = "adult and item:golden-gauntlets"

slingshot = "child and item:slingshot"
bow = "adult and item:bow"
boomerang = "child and item:boomerang"
hookshot = "adult and item:hookshot"
longshot = "adult and item:longshot"

magic = "item:magic-meter"
mirror-shield = "adult and item:mirror-shield"
fire = "(magic and item:dins-fire) or (magic and bow and item:fire-arrows)"
bottle = "item:bottle or item:rutos-letter or item:milk"
blue-fire = "adult and bottle"
light = "adult and (item:mirror-shield or (magic and bow and item:light-arrows))"
lens = "magic and item:lens-of-truth"

kokiri-sword = "child and item:kokiri-sword"
deku-shield = "child and item:deku-shield-chest"
# Deku Babas drop them and the Kokiri shop sells them. Only child Link
# holds them, and they carry fire from a lit torch.
sticks = "child"
silver-scale = "item:silver-scale"
# Past the two boulders at Zora River's mouth: blown up, broken by the
# hammer, or skipped down the Lost Woods shortcut, which lands upriver.
zora-river = "explosives or hammer or silver-scale"
iron-boots = "adult and item:iron-boots"
hover-boots = "adult and item:hover-boots"
# Shops sell the pouch item, the givers hand over the pickup actor.
zora-tunic = "adult and (item:zora-tunic or item:zora-tunic-pickup)"
goron-tunic = "adult and (item:goron-tunic or item:goron-tunic-pickup)"
# The crater floor past the broken bridge: Sheik and the Fire Temple door.
# Either side of the crater ends at a gap only these cross, and Bolero of
# Fire lands past it.
crater-floor = "goron-tunic and (hookshot or hover-boots or (ocarina and item:bolero-of-fire))"

# Hyrule Castle's courtyard, past Talon asleep by the crates. Only the cucco
# that hatches from the Weird Egg wakes him, and an egg from anywhere hatches.
courtyard = "item:weird-egg"

ocarina = "item:fairy-ocarina"
zeldas-lullaby = "ocarina and item:zeldas-lullaby"
eponas-song = "ocarina and item:eponas-song"
sarias-song = "ocarina and item:sarias-song"
song-of-storms = "ocarina and item:song-of-storms"
song-of-time = "ocarina and item:song-of-time"
scarecrow = "hookshot and ocarina and item:scarecrows-song"
magic-beans = "item:magic-bean"

# The masks the Deku Theater asks for, which the Happy Mask Shop lends. The
# shop opens once the Kakariko guard has seen the letter. The Mask of Truth
# comes after every mask is sold, and the Skull Kid who buys the Skull Mask
# needs Saria's Song.
skull-mask = "item:zeldas-letter"
mask-of-truth = "skull-mask and sarias-song"

# Keys stay in their vanilla chests, and the vanilla game reaches each one
# before its door. With `keys` at start Link holds every key from the
# beginning, so this is true by construction. Silver rupees sit in the
# room they open. Dig spots are on the playtest list.
small-key = "always"
silver-rupees = "always"
digging = "always"

# Many Gold Skulltulas sit up a wall, and which ones isn't read yet, so
# logic wants a way to reach every one.
gold-skulltula = "boomerang or hookshot"
# A weapon that hurts a boss up close. The adult always has the Master
# Sword, and Ship's boss rules want a blade or a stick, not any damage.
melee = "adult or kokiri-sword or sticks"
# A Business Scrub sells only once stunned: hit with a weapon, or its
# nut sent back off a shield.
stun-scrub = "melee or deku-shield or slingshot or boomerang"
# Kakariko's beehives hang 4.6 m up under an overhang. Their damage table
# gives the slingshot seed 0, and a bomb's blast falls short of them.
knock-down = "bow or boomerang or hookshot"
