# Hidden grottos whose chest a logic graph gates. Each grotto hides under
# a cover the obstacle table doesn't read: a rock, or a patch of grass
# the Song of Storms clears. Inside, the chest appears once Link clears
# the room, so each rule names the cover and what clears the room.
# Ship's kill rules: a blade beats a ReDead, a Dinolfos or a Wolfos, and
# only explosives beat a Beamos. Rules on the playtest list.

# Hyrule Field, north-east: under storm grass, two ReDeads.
