# Forest Temple. Rules from Ship's routes for the original game, on the
# playtest list (Ship-first rules, 2026-11-24).
#
# Only adult Link is inside, so child-only tools are left out. Past the
# first room, every route runs the Big Skulltula hall, which takes a
# weapon that reaches it: the Hammer, a sword, explosives, Din's Fire, the
# Hookshot or the Bow.

# Room 0, Entrance: the first room's chest, climbed to once inside.
[[check]]
hash = 1171460703078800858
name = "Forest Temple Upper Small Key Chest"
needs = "always"

# Room 0, Entrance: the Skulltula on the first room's wall, so nothing
# past the door reaches it.
[[check]]
hash = 11081821111317815057
name = "Entrance Gold Skulltula"
needs = "always"
setting = "gold-skulltulas"

# Room 2, Main Hall: the Skulltula on the lobby wall, past the Big
# Skulltula hall.
[[check]]
hash = 17612196129225973969
name = "Main Hall Gold Skulltula"
needs = "explosives or hammer or adult-sword or dins-fire or hookshot or bow"
setting = "gold-skulltulas"

