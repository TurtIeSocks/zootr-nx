# How far Link reaches, for the nav graph and the room logic derived from
# it (room reach spec). Every value is measured or read from Link's own
# parameters (`zootr probe arsenal`), and its evidence says which: a
# measured value names its `dev trace` runs, written up in the room
# science notes.

# Glitchless logic counts a move only up to this share of its limit.
# Moves past it are knowledge routes.
margin = 0.85

# The highest ledge Link gets onto from the floor below, in m.
[child.step-up]
value = 0.99
evidence = ["static: StartJumpClamberHeight 0.99"]

[adult.step-up]
value = 1.29
evidence = [
    "measured: runs onto a 1.29 m block without A (adult-cal2, adult-edge-pilot4), a lower bound",
]

# The deepest drop that lands without a hard landing, in m.
[child.drop]
value = 5.0
evidence = [
    "static: LargeLandHeight 5",
    "measured: runs off a 4.65 m ledge and lands running (child-edge-run1, child-edge-run2)",
]

[adult.drop]
value = 5.0
evidence = ["static: LargeLandHeight 5"]

# The widest gap at one height a running jump (X) crosses, in m: its
# run speed times its 0.70 s in the air. Glitchless logic links a gap up
# to `margin` of it.
[child.level-jump]
value = 3.15
evidence = [
    "static: JumpMaxInitSpeed 4.5 m/s, and a jump is 0.70 s in the air (JumpHeight 0.7, measured every time)",
    "measured: 3.04, 3.05, 3.13, 3.15 m in the air at full speed (deku-leap4-1-0, deku-leap5-1-0 tries 2 and 4, deku-leap-1-0-p-0.4)",
    "measured: crosses the Deku Tree Lobby's 2.5 m gap both ways (deku-leap*-0-1, deku-leap*-1-0)",
]

# How far past a ledge's edge a running jump lands, in m, for a drop of
# `drop` m.
[child.edge-jump]
value = 5.2
drop = 4.65
evidence = ["measured: jump at the edge (child-edge-jump-1.08, child-edge-jump-1.00)"]
