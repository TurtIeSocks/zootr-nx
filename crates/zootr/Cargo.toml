[package]
name = "zootr"
version.workspace = true
description = "Randomizer generator for Ocarina of Time on Switch 2"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
flate2.workspace = true
clap.workspace = true
jiff.workspace = true
log.workspace = true
memchr.workspace = true
nup-format.workspace = true
ounce-formats.workspace = true
png.workspace = true
roead.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
specta = { workspace = true, optional = true }
zootr-hook.workspace = true
zstd.workspace = true
archipelago_rs = { version = "3.0.1", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.36", default-features = false, features = ["aws_lc_rs", "std"] }
# GPL-2.0, test-only: the hook's unicorn tests (feature `emu`), never in a release.
unicorn-engine = { version = "2.1.5", optional = true }

[build-dependencies]
zootr-hook.workspace = true

[dev-dependencies]
nup-format = { workspace = true, features = ["fixture"] }
ounce-formats = { workspace = true, features = ["fixture"] }
yaxpeax-arch.workspace = true
yaxpeax-arm.workspace = true

[features]
# `specta::Type` on the API types, for the app's generated TypeScript
specta = ["dep:specta"]
# The hook's unicorn tests (`patch::emu`): runs the hook's bytes in unicorn
emu = ["dep:unicorn-engine"]
