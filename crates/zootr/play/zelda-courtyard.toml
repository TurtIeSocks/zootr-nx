name = "Zelda's chain fades in before the grant"

# Hyrule Castle's only arrival point, outside the grounds, then a warp
# behind Zelda: she faces the throne room window, and in front of her is
# inside the wall. The courtyard's trigger is in the same map.
[setup]
spawn = "HyruleCastle/HyruleCastle_Entrance"
near = "Npc_Hylia_Zelda_Child"
side = "back"

[[step]]
play = "Goto_HyruleCastle"      # an event, by its EventSetting name

[[step]]
until = "HavePlayedEvent.Dm_HrlCastle_0050=true"
within = 20
shot = true

[[step]]
press = "A"                     # close the get window

[[step]]
expect = ["HavePlayedEvent.Dm_HrlCastle_0060=true"]
within = 10
