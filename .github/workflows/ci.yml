name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-pr.yml runs CI on the release PR this way: a PR it opens with
  # GITHUB_TOKEN gets no pull_request run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows build the stubbed live module, macOS the real
        # one. The release ships all three, so all three are gated.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # zootr-app is a workspace member, so clippy and the tests build Tauri.
      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Reads rust-toolchain.toml: the pinned channel, rustfmt, clippy and
      # the hook's aarch64-unknown-none target.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Unit and integration tests, without the doctests, which are very
      # slow. Tests that need the game skip themselves without dump/oot.nup.
      - name: cargo test
        run: cargo test --workspace --lib --bins --tests

  app:
    name: App
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The AP world in ap/znx, against a pinned Archipelago: its own tests and
  # AP's general tests, which check every world it finds. No dump needed.
  archipelago:
    name: Archipelago world (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python AP's CI runs at the pin.
        python: ["3.11", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/archipelago
        with:
          python: ${{ matrix.python }}

      - name: Test the world
        working-directory: archipelago
        run: pytest -n auto worlds/znx test/general
