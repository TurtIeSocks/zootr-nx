name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-pr.yml runs CI on the release PR this way: a PR it opens with
  # GITHUB_TOKEN gets no pull_request run.
  workflow_dispatch:
  # Nightly, main's dump tests with the checks too slow for every PR
  # (ZOOTR_NIGHTLY in dump-tests.sh). The other jobs skip it.
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  # By event too, so a push to main and the nightly run never cancel
  # each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows build the stubbed live module, macOS the real
        # one. The release ships all three, so all three are gated.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # zootr-app is a workspace member, so clippy and the tests build Tauri.
      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/tauri-linux

      # Reads rust-toolchain.toml: the pinned channel, rustfmt, clippy and
      # the hook's aarch64-unknown-none target.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Only main saves. A branch reads main's cache but not another
      # branch's, so its own copy (about 650 MB an OS) only crowded main's
      # out of the 10 GB the repo gets.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Unit and integration tests, without the doctests, which are very
      # slow. Tests that need the game skip themselves without dump/oot.nup,
      # so cargo-ci.toml builds our crates unoptimised.
      - name: cargo test
        run: cargo test --workspace --lib --bins --tests --config .github/cargo-ci.toml

      # The hook's unicorn tests (feature emu, unicorn: GPL, never in a
      # release). Built on one OS so they never rot; they skip without the
      # Mac game's main, which CI doesn't have.
      - name: cargo clippy and test, the hook's unicorn tests
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p zootr --features emu --lib --tests -- -D warnings
          cargo test -p zootr --features emu --lib --config .github/cargo-ci.toml -- patch::emu

  # The tests that need the game dump, which skip themselves above. They run
  # on our own runner, which holds the dump. Never on a fork's code: this
  # if: skips a fork's PR, and the runner refuses one anyway. A PR runs only
  # the name guards: the whole suite runs on main and nightly (dump-tests.sh).
  #
  # Nor on the release PR: its tree is main's plus a version bump and the
  # changelog, which main's own run already tests. Run on every merge, it
  # only halved the box for main's run. A skipped required check passes.
  dump:
    name: Dump tests
    if: >-
      github.head_ref != 'release' && github.ref_name != 'release' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, X64, zootr-nx]
    timeout-minutes: 45
    # dump-tests.sh picks CARGO_TARGET_DIR, one folder a job.
    env:
      CARGO_HOME: /cache/cargo
      RUSTUP_HOME: /cache/rustup
      ZOOTR_CACHE: /cache/zootr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image has no Rust. rustup lives in the cache, so only the
      # first run on a box installs it.
      - name: Install the pinned toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" toolchain install

      - name: cargo test, with the dump
        run: .github/scripts/dump-tests.sh

  # Code files stay under 1000 lines (CLAUDE.md). The local push hook only
  # sees pushes from one machine, so CI holds the line for every PR.
  file-size:
    name: File size
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/file-size.sh

  app:
    name: App
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The AP world in ap/znx, against a pinned Archipelago: its own tests and
  # AP's general tests, which check every world it finds. No dump needed.
  archipelago:
    name: Archipelago world (Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python AP's CI runs at the pin.
        python: ["3.11", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/archipelago
        with:
          python: ${{ matrix.python }}

      - name: Test the world
        working-directory: archipelago
        run: pytest -n auto worlds/znx test/general
