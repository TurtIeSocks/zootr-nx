name: Release

# A `v*` tag builds the app and the CLI for each platform and attaches them
# to a draft release. Publishing the draft is a manual step. See
# .github/RELEASING.md.
#
# release-pr.yml calls this with the tag it just made: a tag pushed with
# GITHUB_TOKEN starts no workflow of its own. A tag pushed by hand still
# comes in through `push`.
#
# The weekly and manual runs on main build the same way but release nothing.
# They keep a release build cache on main: a tag can only read caches from
# its own ref and the default branch, so without one every tag built cold.
# Unused caches go after 7 days, hence weekly.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  TAGGED: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  draft:
    name: Draft release
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag's section of CHANGELOG.md, from its heading to the next
      # one. A tag made by hand may have none: GitHub's notes then.
      - name: Find the tag's changelog section
        run: |
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' \
            CHANGELOG.md 2>/dev/null > notes.md || true
          echo "notes: $(grep -c . notes.md) lines"

      # One job makes the draft so the builds below never race to create it.
      # A rerun reuses the draft it made the first time.
      - name: Create or find the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find_draft() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1
          }
          id=$(find_draft)
          if [ -z "$id" ]; then
            # The create call returns the id: the release list can lag a
            # new draft by a few seconds.
            if grep -q . notes.md; then
              notes=(-F body=@notes.md)
            else
              notes=(-F generate_release_notes=true)
            fi
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" \
              -f name="zootr-nx $TAG" -F draft=true "${notes[@]}" --jq .id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  apworld:
    name: Build znx.apworld
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/archipelago

      # AP's own packager adds the container version to the manifest.
      - name: Build the world
        working-directory: archipelago
        run: python Launcher.py "Build APWorlds" -- "Ocarina of Time (znx)"

      - name: Attach the world
        if: env.TAGGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" archipelago/build/apworlds/znx.apworld --repo "$GITHUB_REPOSITORY" --clobber

      # Each app build embeds this copy, so its Save znx.apworld matches it.
      - name: Hand the world to the app builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: znx-apworld
          path: archipelago/build/apworlds/znx.apworld
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: [draft, apworld]
    # A warm-up run skips the draft, and builds anyway.
    if: ${{ !cancelled() && needs.draft.result != 'failure' && needs.apworld.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
          - name: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/tauri-linux
        with:
          extra: patchelf

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release
          # Only main's cache is any use to the next tag. A release called
          # from main runs on main's ref too, so it saves as well: that keeps
          # the cache warm for the next tag even if the weekly run's was evicted.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install the app's packages
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Just before the app, so the signing secrets reach no earlier step.
      # The CLI steps after it compile only our own crate. Optional.
      # Unset secrets are left out of the environment entirely,
      # because Tauri treats an empty APPLE_CERTIFICATE as a certificate to
      # import. With none set, the app keeps tauri.conf.json's ad-hoc
      # signature and isn't notarized.
      - name: Use the macOS signing secrets that are set
        if: runner.os == 'macOS' && env.TAGGED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<ZOOTR_SECRET_EOF"; printf '%s\n' "${!name}"; echo "ZOOTR_SECRET_EOF"; } >> "$GITHUB_ENV"
              echo "using $name"
            fi
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: znx-apworld
          path: apworld

      # The app's build.rs embeds the file this names.
      - name: Point the app at the world
        shell: bash
        run: echo "ZNX_APWORLD=$GITHUB_WORKSPACE/apworld/znx.apworld" >> "$GITHUB_ENV"

      # Marks a release build (build.rs): the sidebar shows its version
      # and the update notice offers the install. Any other build shows
      # its commit, and the notice only says a release is out.
      - name: Mark a release build
        if: env.TAGGED == 'true'
        shell: bash
        run: echo "ZNX_RELEASE=1" >> "$GITHUB_ENV"

      # build.runner, set for macOS only in tauri.macos.conf.json, is a
      # shell script that signs debug builds for `tauri dev`. A release
      # build has nothing for it to do, so `--runner cargo` skips it.
      # Without a release id (a warm-up run) it only builds.
      - name: Build the app and attach it
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Signs the update bundles. With a release id, tauri-action also
          # uploads latest.json, the feed the app's updater reads.
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAGGED == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAGGED == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          # Updater files need the updater's signing key, which only a
          # tagged build gets. Others build without them. TAURI_CONFIG
          # doesn't turn them off: the CLI still asks for the key.
          args: --runner cargo ${{ env.TAGGED != 'true' && '--config src-tauri/no-updater.conf.json' || '' }}
          releaseId: ${{ needs.draft.outputs.id }}
          # Names without the version, so the README can link each OS's
          # file under releases/latest/download. The matrix name, not
          # tauri-action's [arch], which spells one arch three ways: the
          # app and the CLI then share one name per OS. The .sig files go:
          # latest.json carries each signature, and nothing else reads them.
          releaseAssetNamePattern: "[name]-${{ matrix.name }}[setup][ext]"
          uploadUpdaterSignatures: false

      # After the app, and naming its package too, so cargo picks the
      # features the app build used for the crates they share. Built
      # alone, the CLI wants other features and recompiles about 25 of
      # them. This way only `zootr` itself links.
      - name: Build the CLI
        run: cargo build --release -p zootr -p zootr-app --bin zootr

      # Ad-hoc, with the debugger entitlement `zootr live` needs, as the
      # Makefile does for local builds.
      - name: Sign the CLI for live reads
        if: runner.os == 'macOS'
        run: codesign -f -s - --entitlements crates/zootr/live.entitlements target/release/zootr

      - name: Attach the CLI
        if: env.TAGGED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: zootr-${{ matrix.name }}
        run: |
          cd target/release
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$NAME.zip"
            7z a "$archive" zootr.exe
          else
            archive="$NAME.tar.gz"
            tar -czf "$archive" zootr
          fi
          gh release upload "$TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
