# The option sets `zootr ap room` and `zootr ap bench` generate with, by
# the setting ids in `ap/znx/data/options.json`. Both slots of a room play
# the same preset, and each also starts with the test seeds' items.

# The world's defaults, plus the test seeds' rules.
[defaults]
open-forest = true
kakariko-gate = true
skip-cutscenes = true

# The defaults with Progressive Items off and NPC Gifts on: each check
# deals its own item, every level of a line by its own name.
[progressive-off]
open-forest = true
kakariko-gate = true
skip-cutscenes = true
npc-gifts = true
progressive-items = false

# The defaults with Hints on, for reading the stones in a room.
[hints]
open-forest = true
kakariko-gate = true
skip-cutscenes = true
hints = true

# Every option at its widest: every check kind on. An option the world
# gains joins here in the same PR (a test checks every one is named).
[all-on]
open-forest = true
kakariko-gate = true
met-zelda = true
door-of-time = "open"
jabu-open = true
open-waterfall = true
adult-deku-tree = true
gerudo-fortress = "normal"
npc-gifts = true
songs = true
hundred-token-reward = true
trade-chain = true
merchants = true
master-sword-shuffle = true
shopsanity = true
shop-slots = "8"
freestanding = true
cows = true
gold-skulltulas = true
boss-hearts = true
dungeon-rewards = true
maps-compasses = true
keys = "start"
fortress-keys = "singles"
bombchus = "bag"
skip-cutscenes = true
chest-size = "vanilla"
chest-looks = true
quiet-navi = true
bunny-hood = true
one-tap-songs = true
scrubs = true
running-race = true
pots = true
crates = true
rocks = true
grass = true
hives = true
loose-items = true
shuffle-masks = true
ice-traps = "mayhem"
progressive-items = true
shuffle-nut-bag = true
shuffle-stick-bag = true
# At its widest off: the Magic Meter pooled, its line at full length.
magic-with-first-item = false
logic = "glitchless"
starting-age = "child"
rainbow-bridge = "six-medallions"
ganons-trials = "all-six"
king-zora-moved = true
adult-jabu-jabu = "always"
day-skulltulas = true
breakables-respawn = true
scrub-price = "90"
quiet-enemies = true
menus = true
clock = true
no-tutorials = true
no-pickup-texts = true
hints = true
skipped-cutscenes = ["skip-intro", "skip-kokiri"]
both-ages = [
  "both-ages-kokiri-sword", "both-ages-master-sword", "both-ages-giants-knife",
  "both-ages-biggoron-sword", "both-ages-deku-shield", "both-ages-mirror-shield",
  "both-ages-bow", "both-ages-slingshot", "both-ages-hammer", "both-ages-hookshot",
  "both-ages-longshot", "both-ages-boomerang", "both-ages-deku-sticks",
  "both-ages-iron-boots", "both-ages-hover-boots", "both-ages-zora-tunic",
  "both-ages-goron-tunic",
]
