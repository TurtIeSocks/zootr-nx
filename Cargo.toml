[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/nup-format", "crates/ounce-formats", "crates/zbic", "crates/zootr", "crates/zootr-hook"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
flate2 = "1"
clap = { version = "4", features = ["derive", "env"] }
jiff = "0.2"
log = "0.4"
memchr = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"
roead = { version = "1.0.0", default-features = false, features = ["byml", "sarc"] }
zstd = "0.13"
yaxpeax-arch = { version = "0.3", default-features = false }
yaxpeax-arm = { version = "0.5", default-features = false, features = ["std", "fmt"] }
texture2ddecoder = "0.1.2"
png = "0.18"
nup-format = { path = "crates/nup-format" }
ounce-formats = { path = "crates/ounce-formats" }
zbic = { path = "crates/zbic" }
zootr = { path = "crates/zootr" }
zootr-hook = { path = "crates/zootr-hook" }
# Pinned exact: tauri-specta is still a release candidate and
# needs the matching specta rc.
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "0.0.13"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# zstd and BYML parsing over thousands of files is painfully slow unoptimised.
opt-level = 3

# Ours too: the BYML and zstd code they call is generic, so it compiles into
# them, and unoptimised a seed took 20 s to generate instead of 5.
[profile.dev.package.ounce-formats]
opt-level = 3

[profile.dev.package.nup-format]
opt-level = 3

# The ZBIC decoder reads both builds' `main`, 30 MB each, in the dump tests.
[profile.dev.package.zbic]
opt-level = 3

# The tests spend most of their CPU in our own code: the logic engine's
# lookups and the seed fill. Level 1 halves the dump-backed suite's CPU
# (1004 s to 547 s on the Mac) for an edit that compiles in about 6 s
# instead of 2 to 3. Debug assertions and overflow checks stay on.
[profile.dev.package.zootr]
opt-level = 1
